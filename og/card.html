<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>OG card source</title>
<style>
@font-face{font-family:"Bebas Neue";src:url("../site/fonts/bebas-neue-latin.woff2") format("woff2");font-weight:400}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0f0f10 radial-gradient(#ffffff29 1px,transparent 1.5px) 0 0/20px 20px;color:#f4f2f6;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;position:relative}
.tile{position:absolute;top:44px;right:52px;width:96px;height:96px}
.kicker{position:absolute;left:60px;top:56px;font:700 18px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a8a2b0}
h1{position:absolute;left:56px;top:112px;margin:0;font:400 150px/.88 "Bebas Neue",Arial,sans-serif;letter-spacing:.01em;color:#fff}
h1 .mark{display:inline-block;background:#e2342b;padding:0 16px;line-height:.98}
.sub{position:absolute;left:60px;top:462px;font:400 30px/1.2 "Helvetica Neue",Arial,sans-serif;color:#f4f2f6}
.band{position:absolute;left:0;right:0;bottom:0;height:72px;background:#c9251d;display:flex;align-items:center;justify-content:space-between;padding:0 60px 0 48px;color:#fff}
.band img{height:48px}
.band .r{font:700 15px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
</style></head>
<body>
<img class="tile" src="https://promptityourself.com/media/logo/piy-tile.svg" alt="">
<div class="kicker">A session proposed for Brent · North Lakes</div>
<h1>Your shop.<br><span class="mark">Built live.</span> By you.</h1>
<div class="sub">Free. Up to four hours. An AI agent on your own laptop. Everything stays yours.</div>
<div class="band"><img src="https://promptityourself.com/media/logo/piy-lockup-white-512.png" alt="Prompt It Yourself"><span class="r">Proposed session · Shopify</span></div>
</body></html>
